services:
  # Next.js Frontend
  - type: web
    name: vedaai-frontend
    env: node
    region: oregon
    buildCommand: npm install && npm run build -w @vedaai/shared && npm run build -w apps/frontend
    startCommand: npm run start -w apps/frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: vedaai-backend
          envVarKey: RENDER_EXTERNAL_URL

  # Express.js Backend
  - type: web
    name: vedaai-backend
    env: node
    region: oregon
    buildCommand: npm install && npm run build -w @vedaai/shared && npm run build -w apps/backend
    startCommand: npm run start -w apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "*"
      # Fill these out in the Render Dashboard -> Environment after deploying:
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
